<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MentoraAI API</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d8dde5;
      --text: #1f2933;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.4;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      padding: 18px 24px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 16px;
      padding: 16px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--text);
      font: inherit;
      padding: 9px 10px;
    }

    button {
      border: 0;
      border-radius: 4px;
      background: var(--primary);
      color: #ffffff;
      cursor: pointer;
      font-weight: 700;
      min-height: 38px;
      padding: 9px 13px;
    }

    button:hover {
      background: var(--primary-dark);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .secondary {
      background: #475569;
    }

    .secondary:hover {
      background: #334155;
    }

    .result {
      background: #111827;
      border-radius: 6px;
      color: #e5e7eb;
      margin: 16px 0 0;
      min-height: 130px;
      overflow: auto;
      padding: 12px;
      white-space: pre-wrap;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>MentoraAI API</h1>
  </header>

  <main>
    <section>
      <h2>Demonstração automática</h2>
      <button id="btnDemonstracao" type="button">Executar demonstração</button>
      <pre id="saidaDemonstracao" class="result">{}</pre>
    </section>

    <section>
      <h2>Cadastrar mentor</h2>
      <form id="formMentor">
        <div class="grid">
          <div>
            <label for="mentorNome">Nome</label>
            <input id="mentorNome" value="Marina">
          </div>
          <div>
            <label for="mentorNivel">Nivel</label>
            <select id="mentorNivel">
              <option>SENIOR</option>
              <option>ESPECIALISTA</option>
              <option>PLENO</option>
              <option>JUNIOR</option>
            </select>
          </div>
          <div>
            <label for="mentorValorHora">Valor hora</label>
            <input id="mentorValorHora" type="number" step="0.01" value="150">
          </div>


          <div>
            <label for="mentorSkills">Skills separadas por virgula</label>
            <input id="mentorSkills" value="JAVA, SPRING, SQL, GIT">
          </div>
        </div>
        <div class="actions">
          <button type="submit">Cadastrar mentor</button>
        </div>
      </form>
      <pre id="saidaMentor" class="result">{}</pre>
    </section>

    <section>
      <h2>Cadastrar mentorado</h2>
      <form id="formMentorado">
        <div class="grid">
          <div>
            <label for="mentoradoNome">Nome</label>
            <input id="mentoradoNome" value="Lucas">
          </div>
          <div>
            <label for="mentoradoNivel">Nivel</label>
            <select id="mentoradoNivel">
              <option>JUNIOR</option>
              <option>PLENO</option>
            </select>
          </div>
          <div>
            <label for="mentoradoValorHora">Valor hora</label>
            <input id="mentoradoValorHora" type="number" step="0.01" value="80">
          </div>
          <div>
            <label for="mentoradoHoras">Horas dedicadas</label>
            <input id="mentoradoHoras" type="number" step="0.5" value="5">
          </div>
          <div>
            <label for="mentoradoSkills">Skills atuais</label>
            <input id="mentoradoSkills" value="HTML, CSS">
          </div>
          <div>
            <label for="mentoradoSkillsDesejadas">Skills desejadas</label>
            <input id="mentoradoSkillsDesejadas" value="JAVA, SPRING, SQL">
          </div>
        </div>
        <div class="actions">
          <button type="submit">Cadastrar mentorado</button>
        </div>
      </form>
      <pre id="saidaMentorado" class="result">{}</pre>
    </section>

    <section>
      <h2>Criar trilha</h2>
      <form id="formTrilha">
        <div class="grid">
          <div>
            <label for="trilhaNome">Nome da trilha</label>
            <input id="trilhaNome" value="Trilha Java Backend">
          </div>
          <div>
            <label for="trilhaCiclo">Ciclo em meses</label>
            <input id="trilhaCiclo" type="number" value="3">
          </div>
          <div>
            <label for="trilhaMentorId">ID do mentor</label>
            <input id="trilhaMentorId" type="number" placeholder="Ex: 1">
          </div>
          <div>
            <label for="trilhaMentoradosIds">IDs dos mentorados</label>
            <input id="trilhaMentoradosIds" placeholder="Ex: 2, 3">
          </div>
        </div>
        <p class="status">Apos cadastrar mentor e mentorado, os IDs sao preenchidos automaticamente aqui.</p>
        <div class="actions">
          <button type="submit">Criar trilha</button>
        </div>
      </form>
      <pre id="saidaTrilha" class="result">{}</pre>
    </section>

    <section>
      <h2>Consultas</h2>
      <div class="actions">
        <button id="btnMentores" type="button">Listar mentores</button>
        <button id="btnMentorados" type="button">Listar mentorados</button>
        <button id="btnTrilhas" type="button">Listar trilhas</button>
        <button id="btnTodas" class="secondary" type="button">Consultar tudo</button>
        <button id="btnLimparConsultas" class="secondary" type="button">Limpar consulta</button>
      </div>
      <pre id="saidaConsultas" class="result">{}</pre>
    </section>
  </main>

  <script>
    const state = {
      ultimosMentoradosIds: []
    };

    function lista(valor) {
      return valor.split(',')
        .map(item => item.trim().toUpperCase())
        .filter(Boolean);
    }

    function listaNumeros(valor) {
      return valor.split(',')
        .map(item => Number(item.trim()))
        .filter(item => Number.isFinite(item) && item > 0);
    }

    function mostrar(elementId, data, response) {
      const envelope = {
        statusHttp: response.status,
        ok: response.ok,
        retorno: data
      };
      document.getElementById(elementId).textContent = JSON.stringify(envelope, null, 2);
    }

    async function chamarApi(url, options, outputId) {
      const response = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const text = await response.text();
      const data = text ? JSON.parse(text) : null;
      mostrar(outputId, data, response);
      return { response, data };
    }

    document.getElementById('btnDemonstracao').addEventListener('click', async () => {
      await chamarApi('/api/demonstracao/automatica', { method: 'GET' }, 'saidaDemonstracao');
    });

    document.getElementById('formMentor').addEventListener('submit', async event => {
      event.preventDefault();
      const payload = {
        nome: document.getElementById('mentorNome').value,
        nivelSenioridade: document.getElementById('mentorNivel').value,
        skills: lista(document.getElementById('mentorSkills').value),
        valorHora: Number(document.getElementById('mentorValorHora').value)
      };
      const { response, data } = await chamarApi('/api/mentores', {
        method: 'POST',
        body: JSON.stringify(payload)
      }, 'saidaMentor');

      if (response.ok && data && data.id) {
        document.getElementById('trilhaMentorId').value = data.id;
      }
    });

    document.getElementById('formMentorado').addEventListener('submit', async event => {
      event.preventDefault();
      const payload = {
        nome: document.getElementById('mentoradoNome').value,
        nivelSenioridade: document.getElementById('mentoradoNivel').value,
        skills: lista(document.getElementById('mentoradoSkills').value),
        valorHora: Number(document.getElementById('mentoradoValorHora').value),
        horasDedicadas: Number(document.getElementById('mentoradoHoras').value),
        skillsDesejadas: lista(document.getElementById('mentoradoSkillsDesejadas').value)
      };
      const { response, data } = await chamarApi('/api/mentorados', {
        method: 'POST',
        body: JSON.stringify(payload)
      }, 'saidaMentorado');

      if (response.ok && data && data.id) {
        state.ultimosMentoradosIds.push(data.id);
        document.getElementById('trilhaMentoradosIds').value = state.ultimosMentoradosIds.join(', ');
      }
    });

    document.getElementById('formTrilha').addEventListener('submit', async event => {
      event.preventDefault();
      const payload = {
        nome: document.getElementById('trilhaNome').value,
        cicloEmMeses: Number(document.getElementById('trilhaCiclo').value),
        idMentor: Number(document.getElementById('trilhaMentorId').value),
        idsMentorados: listaNumeros(document.getElementById('trilhaMentoradosIds').value)
      };
      await chamarApi('/api/trilhas', {
        method: 'POST',
        body: JSON.stringify(payload)
      }, 'saidaTrilha');
    });

    document.getElementById('btnMentores').addEventListener('click', async () => {
      await chamarApi('/api/mentores', { method: 'GET' }, 'saidaConsultas');
    });

    document.getElementById('btnMentorados').addEventListener('click', async () => {
      await chamarApi('/api/mentorados', { method: 'GET' }, 'saidaConsultas');
    });

    document.getElementById('btnTrilhas').addEventListener('click', async () => {
      await chamarApi('/api/trilhas', { method: 'GET' }, 'saidaConsultas');
    });

    document.getElementById('btnTodas').addEventListener('click', async () => {
      const [mentores, mentorados, trilhas] = await Promise.all([
        fetch('/api/mentores').then(response => response.json()),
        fetch('/api/mentorados').then(response => response.json()),
        fetch('/api/trilhas').then(response => response.json())
      ]);
      document.getElementById('saidaConsultas').textContent = JSON.stringify({
        mentores,
        mentorados,
        trilhas
      }, null, 2);
    });

    document.getElementById('btnLimparConsultas').addEventListener('click', () => {
      document.getElementById('saidaConsultas').textContent = '{}';
    });
  </script>
</body>
</html>
